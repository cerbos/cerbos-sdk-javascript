packages:
  - packages/*
  - private/*

allowBuilds:
  "@bufbuild/buf": false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

linkWorkspacePackages: true

minimumReleaseAge: 7200 # 5 days
minimumReleaseAgeExclude:
  - "@cerbos/*"
  - react
  - react-dom
  - scheduler
  # Renovate security update: adm-zip@0.6.1
  - adm-zip@0.6.1

saveExact: true
