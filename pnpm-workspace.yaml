packages:
  - packages/*
  - private/*

allowBuilds:
  "@bufbuild/buf": false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

autoDedupe: true

linkWorkspacePackages: true

minimumReleaseAge: 7200 # 5 days
minimumReleaseAgeExclude:
  - "@cerbos/*"
  - react
  - react-dom
  - scheduler

saveExact: true
