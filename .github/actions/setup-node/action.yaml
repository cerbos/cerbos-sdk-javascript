name: Set up Node.js

description: Install Node.js and npm dependencies

inputs:
  cache:
    description: Cache dependencies?
    required: false
    default: "true"

  runtime:
    description: Version of Node.js to install
    required: false

runs:
  using: composite

  steps:
    - name: Set up Node.js
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        cache: ${{ inputs.cache }}
        runtime: ${{ inputs.runtime }}
