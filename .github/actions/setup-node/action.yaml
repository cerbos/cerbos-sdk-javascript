name: Set up Node.js

description: Install Node.js and npm dependencies

inputs:
  cache:
    description: Cache dependencies?
    required: false
    default: "true"

  runtime:
    description: Version of Node.js to install
    required: false

runs:
  using: composite

  steps:
    - name: Set up Node.js
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: ${{ inputs.cache }}
        runtime: ${{ inputs.runtime }}
